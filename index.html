<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Equipos - VRINKA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============ 1. TOKENS "Vrinka Score Cards" (exactos) ============ */
        :root {
            --pink: #FF007F;
            --blue: #007BFF;
            --purple: #9B00FF;
            --dark: #2C2C2C;
            --lime: #97D700;
            --yellow: #FFDD00;
            --bg: #121214;
            --panel: #1c1c20;
            --line: rgba(255, 255, 255, .09);
            --muted: #9a9aa8;
            /* alias compatibilidad con código anterior */
            --primary: var(--pink);
            --secondary: var(--blue);
            --tertiary: var(--purple);
            --highlight1: var(--lime);
            --highlight2: var(--yellow);
            --rf: 1; /* escala de filas (sube con pocas filas) */
        }

        * { box-sizing: border-box; }

        /* ============ 3. FONDO GENERAL ANIMADO (6 colores) ============ */
        body {
            font-family: 'Oxanium', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 44px 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: clip;
            background-color: #0e0e11;
            background-image:
                radial-gradient(620px 420px at 12% -4%, rgba(255, 0, 127, .26), transparent 62%),
                radial-gradient(720px 460px at 88% 2%, rgba(0, 123, 255, .24), transparent 62%),
                radial-gradient(860px 520px at 50% 112%, rgba(155, 0, 255, .22), transparent 62%),
                radial-gradient(420px 300px at 3% 96%, rgba(151, 215, 0, .11), transparent 62%),
                radial-gradient(420px 300px at 97% 92%, rgba(255, 221, 0, .11), transparent 62%),
                linear-gradient(180deg, #141419 0%, #1b1030 100%);
            background-size: 200% 200%, 200% 200%, 200% 200%, 200% 200%, 200% 200%, 200% 200%;
            background-position: 0% 0%, 100% 0%, 50% 100%, 0% 100%, 100% 100%, 0% 0%;
            animation: bgDrift 22s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            from {
                background-position: 0% 0%, 100% 0%, 50% 100%, 0% 100%, 100% 100%, 0% 0%;
            }
            to {
                background-position: 100% 100%, 0% 100%, 50% 0%, 100% 0%, 0% 0%, 100% 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
            * { transition-duration: .01ms !important; }
        }

        .page {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ============ 2. TIPOGRAFÍA ============ */
        .tagline {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 auto 12px;
            max-width: 660px;
            line-height: 1.8;
            padding: 0 8px;
        }

        h1 {
            margin: 0 0 14px;
            text-align: center;
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            line-height: 1.05;
            background: linear-gradient(90deg, var(--pink) 0%, var(--purple) 50%, var(--blue) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 10px rgba(255, 0, 127, .35));
        }

        .subtitle {
            margin: 16px 0 0;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }

        /* ============ 5. BARRAS AHUSADAS (firma) ============ */
        .bar {
            width: 100%;
            border: 0;
            background:
                repeating-linear-gradient(-55deg, rgba(255, 255, 255, .18) 0 2px, transparent 2px 12px),
                linear-gradient(90deg, var(--pink) 0%, var(--purple) 50%, var(--blue) 100%);
        }
        .bar--large {
            height: 14px;
            margin: 12px 0 28px;
            clip-path: polygon(0 0, 100% 0, 100% 4px, 0 100%);
            filter: drop-shadow(0 0 10px rgba(255, 0, 127, .45));
        }
        .bar--small {
            height: 9px;
            margin: 18px 0 20px;
            clip-path: polygon(0 0, 100% 0, 100% 3px, 0 100%);
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, .35));
            opacity: .9;
        }

        /* ============ 8. CONTROLES (pastillas + botones, visibles) ============ */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .game-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            background: rgba(0, 0, 0, .45);
            padding: 14px 16px;
            border-radius: 999px;
            border: 1px solid var(--line);
        }

        .game-btn {
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            color: #d7d7e0;
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Oxanium', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all .22s ease;
        }

        .game-btn:hover {
            border-color: rgba(255, 0, 127, .6);
            color: #fff;
        }

        .game-btn.active {
            background: linear-gradient(90deg, var(--pink), var(--purple));
            border-color: transparent;
            color: #fff;
            font-style: italic;
            font-weight: 800;
            box-shadow: 0 0 16px rgba(255, 0, 127, .55);
        }

        .game-btn:focus-visible,
        .sort-toggle:focus-visible,
        #teamSearch:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        .sort-toggle {
            background: linear-gradient(90deg, var(--lime), var(--yellow));
            border: 0;
            color: #141419;
            padding: 12px 26px;
            cursor: pointer;
            font-family: 'Oxanium', sans-serif;
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: .85rem;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            transition: filter .22s ease, transform .22s ease;
        }

        .sort-toggle:hover { filter: brightness(1.08); transform: translateY(-1px); }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
            min-width: 220px;
        }

        #teamSearch {
            width: 100%;
            padding: 11px 20px;
            background: rgba(0, 0, 0, .45);
            border: 1px solid var(--line);
            border-radius: 999px;
            color: white;
            font-family: 'Oxanium', sans-serif;
            font-size: .95rem;
            transition: border-color .22s ease, box-shadow .22s ease;
        }

        #teamSearch::placeholder { color: var(--muted); }

        #teamSearch:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 12px rgba(155, 0, 255, .5);
        }

        /* ============ CONTENEDOR (maestro, con textura punto 4) ============ */
        .ranking-container {
            width: 100%;
            background:
                repeating-linear-gradient(-55deg, transparent 0 18px, rgba(255, 255, 255, .03) 18px 20px),
                linear-gradient(180deg, rgba(28, 28, 32, .96), rgba(28, 28, 32, .9)),
                radial-gradient(500px 220px at 8% 0%, rgba(255, 0, 127, .14), transparent 60%),
                radial-gradient(500px 220px at 92% 0%, rgba(0, 123, 255, .14), transparent 60%);
            background-color: var(--panel);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, .12);
            padding: 20px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, .55),
                0 0 0 3px rgba(155, 0, 255, .15),
                0 0 44px rgba(255, 0, 127, .18);
            overflow: hidden;
            position: relative;
        }

        /* Preparado para cover de juego futura: <div class="ranking-container has-cover"><img class="cover">… */
        .ranking-container.has-cover .cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .28;
            pointer-events: none;
        }
        .ranking-container.has-cover .rank-table-wrap { position: relative; }

        /* ============ 6. FILAS DE RANKING + BADGES ============ */
        table { width: 100%; border-collapse: collapse; }

        thead {
            position: absolute;
            width: 1px; height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        tbody {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity .22s ease;
        }
        tbody.fading { opacity: 0; }

        tbody tr {
            display: grid;
            grid-template-columns: 92px 1fr auto;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, .5);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 12px;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            padding: 10px 26px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .8);
            transition: background .22s ease, border-color .22s ease;
        }

        tbody tr:hover { background: rgba(0, 0, 0, .62); border-color: rgba(255, 255, 255, .24); }

        /* Badge: color en ::before con corte diagonal; número encima sin recorte */
        .rank-col {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(56px * var(--rf));
            text-align: center;
        }
        .rank-col::before {
            content: "";
            position: absolute;
            inset: 2px 6px;
            background: #2b2b32;
            clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
        }
        .rank-num {
            position: relative;
            z-index: 1;
            font-weight: 800;
            font-style: italic;
            font-size: calc(1.7rem * var(--rf));
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
            transform: translateY(-1px);
        }
        tr.rank-1 .rank-col::before { background: var(--pink); box-shadow: 0 0 18px rgba(255, 0, 127, .8); }
        tr.rank-1 .rank-num { text-shadow: 0 0 16px rgba(255, 0, 127, .9); font-size: calc(2rem * var(--rf)); }
        tr.rank-2 .rank-col::before { background: var(--blue); box-shadow: 0 0 18px rgba(0, 123, 255, .8); }
        tr.rank-2 .rank-num { text-shadow: 0 0 16px rgba(0, 123, 255, .9); }
        tr.rank-3 .rank-col::before { background: var(--purple); box-shadow: 0 0 18px rgba(155, 0, 255, .8); }
        tr.rank-3 .rank-num { text-shadow: 0 0 16px rgba(155, 0, 255, .9); }

        .team-col { min-width: 0; }
        .team-name {
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-size: calc(1.05rem * var(--rf));
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        tr.rank-1 .team-name { font-size: calc(1.2rem * var(--rf)); }
        .team-sub {
            margin-top: 2px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        td { padding: 0; }
        .score-col { text-align: right; }
        .score-main {
            font-weight: 800;
            font-style: italic;
            font-size: calc(1.35rem * var(--rf));
            color: var(--yellow);
            text-shadow: 0 0 14px rgba(255, 221, 0, .35);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        tr.rank-1 .score-main { color: #fff; text-shadow: 0 0 18px rgba(255, 255, 255, .5), 0 0 14px rgba(255, 221, 0, .35); }
        .score-sub {
            margin-top: 2px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Pocas filas (≤4): apilado + todo escala con --rf */
        .ranking-container.few-rows { --rf: 1.18; }
        .ranking-container.few-rows tbody tr {
            grid-template-columns: 92px 1fr;
            grid-template-areas: "badge team" "badge score";
            row-gap: 2px;
            padding: 14px 28px;
        }
        .ranking-container.few-rows .rank-col { grid-area: badge; align-self: stretch; }
        .ranking-container.few-rows .team-col { grid-area: team; }
        .ranking-container.few-rows .score-col { grid-area: score; text-align: left; }

        .empty-row td {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 24px;
            clip-path: none;
        }

        /* ============ 7. BANDA INFERIOR ============ */
        footer.bottom-band {
            width: 100vw;
            margin-left: calc(50% - 50vw);
            margin-top: 26px;
            background:
                repeating-linear-gradient(-55deg, rgba(255, 255, 255, .07) 0 2px, transparent 2px 16px),
                linear-gradient(90deg, rgba(255, 0, 127, .5) 0%, rgba(155, 0, 255, .38) 55%, rgba(0, 123, 255, .32) 100%);
            border-top: 1px solid rgba(255, 255, 255, .14);
        }
        .bottom-band-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            gap: 16px;
            flex-wrap: wrap;
        }
        .brand-slot {
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: .9rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .8);
            white-space: nowrap;
        }
        .date-chip {
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: .8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* ============ MODAL ============ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, .75);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 44px rgba(255, 0, 127, .18);
            padding: 22px;
            border-radius: 18px;
            width: 100%;
            max-width: 600px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 16px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: 0;
        }

        .close-btn:hover { color: white; }

        .modal-title {
            text-align: center;
            margin: 0 0 8px;
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .modal-score-item {
            background: rgba(0, 0, 0, .5);
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-left: 4px solid var(--blue);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .modal-score-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .modal-score-value {
            font-size: 1.2em;
            color: var(--yellow);
            text-shadow: 0 0 14px rgba(255, 221, 0, .35);
            font-weight: 800;
            font-style: italic;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 640px) {
            body { padding: 30px 14px 0; }
            h1 { letter-spacing: 1px; }
            .tagline { font-size: 10px; padding: 0 4px; }
            .bar--large { margin: 8px 0 22px; }
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
            .game-selector {
                flex-wrap: nowrap;
                justify-content: flex-start;
                overflow-x: auto;
                border-radius: 18px;
                padding: 12px;
                max-width: 100%;
                scrollbar-width: thin;
            }
            .game-btn { flex: 0 0 auto; }
            .sort-toggle { width: 100%; }
            .search-container { max-width: none; }
            .ranking-container { padding: 14px 10px; }
            tbody tr {
                grid-template-columns: 64px 1fr;
                grid-template-areas: "badge team" "badge score";
                row-gap: 2px;
                padding: 10px 20px 10px 8px;
                gap: 10px;
            }
            .rank-col { grid-area: badge; align-self: stretch; }
            .team-col { grid-area: team; min-width: 0; }
            .score-col { grid-area: score; text-align: left; }
            .team-name { white-space: normal; }
            .bottom-band { margin-top: 22px; }
            .bottom-band-inner {
                flex-direction: column;
                gap: 10px;
                padding: 18px 14px;
            }
            .brand-slot { font-size: .8rem; }
            .date-chip {
                white-space: normal;
                text-align: center;
                font-size: .72rem;
                line-height: 1.6;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>Ranking de Equipos</h1>
        <p class="tagline">¿Estás entre los mejores? Admira el Top 10 o localiza a tu equipo en el buscador</p>
        <div class="bar bar--large" aria-hidden="true"></div>

        <div class="controls">
            <div class="game-selector" id="gameSelector">
                <!-- Buttons will be injected here -->
            </div>

            <button class="sort-toggle" id="sortToggle">
                Orden: Puntuación Total
            </button>

            <div class="search-container">
                <input type="text" id="teamSearch" placeholder="Buscar equipo… (Enter)">
            </div>
        </div>
        <p class="subtitle" id="gameSubtitle"></p>
        <div class="bar bar--small" aria-hidden="true"></div>

        <div class="ranking-container" id="rankingContainer">
            <div class="rank-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Equipo</th>
                            <th>Puntuación</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="bottom-band">
        <div class="bottom-band-inner">
            <span class="brand-slot">Vrinka</span>
            <span class="date-chip">Última actualización: <span id="lastUpdate">Cargando...</span></span>
            <span class="brand-slot">Rankings</span>
        </div>
    </footer>

    <!-- Modal for Team Details -->
    <div id="teamModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button class="close-btn" aria-label="Cerrar">&times;</button>
            <h2 class="modal-title" id="modalTeamName">Nombre del Equipo</h2>
            <div class="bar bar--small" aria-hidden="true"></div>
            <div id="modalScores">
                <!-- Scores will be injected here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Google Apps Script Web App URL
            const DATA_URL = 'https://script.google.com/macros/s/AKfycbzuVAxTG_-iWXFbxGnD8SnQs6H6-7hSnzlZgaRNotBg0f-r9xfkXwXmJ6vdon3zbtVm/exec';

            const rankingBody = document.getElementById('rankingBody');
            const rankingContainer = document.getElementById('rankingContainer');
            const gameSelector = document.getElementById('gameSelector');
            const gameSubtitle = document.getElementById('gameSubtitle');
            const lastUpdateSpan = document.getElementById('lastUpdate');
            const teamSearch = document.getElementById('teamSearch');
            const sortToggle = document.getElementById('sortToggle');
            const modal = document.getElementById('teamModal');
            const modalTeamName = document.getElementById('modalTeamName');
            const modalScores = document.getElementById('modalScores');
            const closeBtn = document.querySelector('.close-btn');

            let allScores = [];
            let currentGame = null;
            let sortByPerPlayer = false; // false = Total Score, true = Score Per Player

            // 1) Live data → 2) local hz-scores.json (útil en GitHub Pages) → 3) error visible
            fetch(DATA_URL + '?action=getScores')
                .then(response => {
                    if (!response.ok) throw new Error('Apps Script: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    allScores = processData(data);
                    initializeUI();
                })
                .catch(error => {
                    console.warn('Live fetch failed, trying local hz-scores.json:', error);
                    fetch('hz-scores.json')
                        .then(r => {
                            if (!r.ok) throw new Error('local: ' + r.status);
                            return r.json();
                        })
                        .then(data => {
                            allScores = processData(data);
                            initializeUI();
                        })
                        .catch(error2 => {
                            console.error('Error loading data:', error2);
                            rankingBody.innerHTML = '<tr class="empty-row"><td colspan="3">Error cargando datos. Revisa la URL de Apps Script o el fichero hz-scores.json.</td></tr>';
                        });
                });

            function processData(data) {
                const processed = [];
                let latestDate = null;

                data.forEach(entry => {
                    // 1. Handle Empty Title
                    let gameTitle = entry.game ? entry.game.trim() : "CopsVsRobbers";
                    if (gameTitle === "") gameTitle = "CopsVsRobbers";

                    // 2. Filter Cook'd Up Dates
                    // Cook'd Up scores are only valid from July 1, 2025
                    const entryDate = new Date(entry.date);
                    if (gameTitle === "Cook'd Up") {
                        const cutoffDate = new Date('2025-07-01T00:00:00');
                        if (entryDate < cutoffDate) {
                            return; // Skip this entry
                        }
                    }

                    // Exclude entries with no data if any (though JSON seems to have data)
                    if (!entry.teamName || !entry.score) return;

                    // Track latest date for footer
                    if (!latestDate || entryDate > latestDate) {
                        latestDate = entryDate;
                    }

                    processed.push({
                        ...entry,
                        game: gameTitle,
                        scorePerPlayer: entry.playerCount > 0 ? Math.round(entry.score / entry.playerCount) : 0,
                        dateObj: entryDate
                    });
                });

                // Update Footer
                if (latestDate) {
                    lastUpdateSpan.textContent = latestDate.toLocaleString('es-ES', {
                        year: 'numeric', month: 'long', day: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                }

                return processed;
            }

            function initializeUI() {
                // Get Unique Games
                const games = [...new Set(allScores.map(s => s.game))].sort();

                // Create Game Buttons
                gameSelector.innerHTML = '';
                games.forEach((game, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn';
                    btn.textContent = game;
                    btn.onclick = () => selectGame(game);
                    gameSelector.appendChild(btn);

                    // Select first game by default
                    if (index === 0) {
                        selectGame(game);
                    }
                });
            }

            function selectGame(game) {
                currentGame = game;

                // Update Buttons Visual State
                document.querySelectorAll('.game-btn').forEach(btn => {
                    if (btn.textContent === game) btn.classList.add('active');
                    else btn.classList.remove('active');
                });

                renderTable();
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[c]));
            }

            function renderTable() {
                if (!currentGame) return;

                // Transición de estado (~0.22s fundido)
                rankingBody.classList.add('fading');

                requestAnimationFrame(() => setTimeout(() => {
                    // Filter by Game
                    let displayScores = allScores.filter(s => s.game === currentGame);

                    // Sort
                    if (sortByPerPlayer) {
                        displayScores.sort((a, b) => b.scorePerPlayer - a.scorePerPlayer);
                    } else {
                        displayScores.sort((a, b) => b.score - a.score);
                    }

                    gameSubtitle.textContent = currentGame + ' · top 10 de ' + displayScores.length + ' equipos';

                    // Top 10
                    displayScores = displayScores.slice(0, 10);

                    // Pocas filas (≤4): layout apilado + escala --rf
                    rankingContainer.classList.toggle('few-rows', displayScores.length <= 4 && displayScores.length > 0);

                    // Render Rows
                    rankingBody.innerHTML = '';
                    if (displayScores.length === 0) {
                        rankingBody.innerHTML = '<tr class="empty-row"><td colspan="3">Sin resultados para este juego.</td></tr>';
                    }
                    displayScores.forEach((score, index) => {
                        const pos = index + 1;
                        const row = document.createElement('tr');
                        row.className = pos <= 3 ? 'rank-' + pos : '';

                        const cellRank = document.createElement('td');
                        cellRank.className = 'rank-col';
                        const num = document.createElement('span');
                        num.className = 'rank-num';
                        num.textContent = pos;
                        cellRank.appendChild(num);

                        const cellTeam = document.createElement('td');
                        cellTeam.className = 'team-col';
                        const name = document.createElement('div');
                        name.className = 'team-name';
                        name.textContent = score.teamName;
                        const sub = document.createElement('div');
                        sub.className = 'team-sub';
                        sub.textContent = score.dateObj.toLocaleDateString('es-ES') + ' · ' + score.playerCount + ' jug.';
                        cellTeam.appendChild(name);
                        cellTeam.appendChild(sub);

                        const cellScore = document.createElement('td');
                        cellScore.className = 'score-col';
                        const main = document.createElement('div');
                        main.className = 'score-main';
                        main.textContent = score.score.toLocaleString('es-ES');
                        const ssub = document.createElement('div');
                        ssub.className = 'score-sub';
                        ssub.textContent = sortByPerPlayer
                            ? score.scorePerPlayer.toLocaleString('es-ES') + ' pts/jug · total ' + score.score.toLocaleString('es-ES')
                            : score.scorePerPlayer.toLocaleString('es-ES') + ' pts/jug';
                        cellScore.appendChild(main);
                        cellScore.appendChild(ssub);

                        row.appendChild(cellRank);
                        row.appendChild(cellTeam);
                        row.appendChild(cellScore);
                        rankingBody.appendChild(row);
                    });

                    rankingBody.classList.remove('fading');
                }, 120));
            }

            // Sorting Toggle Logic
            sortToggle.addEventListener('click', () => {
                sortByPerPlayer = !sortByPerPlayer;
                sortToggle.textContent = sortByPerPlayer ? "Orden: Puntos/Jugador" : "Orden: Puntuación Total";
                renderTable();
            });

            // Search Logic (Popup)
            teamSearch.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const term = teamSearch.value.trim().toLowerCase();
                    if (!term) return;
                    showTeamDetails(term);
                }
            });

            function showTeamDetails(term) {
                const teamMatches = allScores.filter(s => s.teamName.toLowerCase().includes(term));

                if (teamMatches.length === 0) {
                    alert('No se encontraron equipos con ese nombre.');
                    return;
                }

                modalTeamName.textContent = `Resultados para "${teamSearch.value}"`;
                modalScores.innerHTML = '';

                // Sort matches by date descending
                teamMatches.sort((a, b) => b.dateObj - a.dateObj);

                teamMatches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'modal-score-item';
                    div.innerHTML = `
                        <div class="modal-score-header">
                            <strong>${escapeHtml(match.game)}</strong>
                            <span>${match.dateObj.toLocaleDateString('es-ES')}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                            <div>${escapeHtml(match.teamName)}</div>
                            <div class="modal-score-value">${match.score.toLocaleString('es-ES')} pts</div>
                        </div>
                    `;
                    modalScores.appendChild(div);
                });

                modal.style.display = 'flex';
            }

            // Modal Controls
            closeBtn.onclick = () => modal.style.display = 'none';
            window.onclick = (event) => {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') modal.style.display = 'none';
            });
        });
    </script>
</body>

</html>
